<!DOCTYPE html>
<html lang="id" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template Undangan</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.3.0/latin.css"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <div class="page">
      <main class="container">
        <header class="page-header">
          <h1 class="page-title">Template Undangan Faza & Jiehan</h1>
          <p class="page-description">
            Tulis teks template kamu, gunakan <code>$penerima</code> sebagai
            placeholder, lalu isi nama penerimanya.
          </p>
        </header>

        <section class="layer-card">
          <div class="form-grid">
            <div class="field">
              <label class="label" for="template">Teks Template</label>
              <textarea class="textarea" id="template" rows="10">Assalamu'alaikum Wr. Wb
Bismillahirahmanirrahim. Tanpa mengurangi rasa hormat, perkenankan kami mengundang Kepada Yth. $penerima untuk menghadiri acara pernikahan kami :

Faza Agil Sulsyansyah, S.T &amp; Jiehan Ayu Fahnie, S.Ak

 *Berikut link undangan kami, untuk info lengkap dari acara bisa kunjungi :*
💌 https://willooos.my.canva.site/wedding-of-faza-jiehan

Merupakan suatu kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan untuk hadir dan memberikan doa restu.

*Mohon maaf perihal undangan hanya kami sampaikan melalui pesan singkat ini dikarenakan keterbatasan waktu dan jarak.*

Terima kasih banyak atas perhatiannya.
Wassalamu'alaikum Wr. Wb.

Terima Kasih.

Hormat kami,
Faza &amp; Jiehan</textarea>
              <p class="hint">
                Gunakan <code>$penerima</code> sebagai pengganti nama.
              </p>
            </div>

            <div class="field">
              <label class="label" for="recipient">Nama Penerima</label>
              <div class="input-wrap">
                <input
                  class="input"
                  id="recipient"
                  type="text"
                  placeholder="Ketik nama di sini..."
                  autocomplete="off"
                  spellcheck="false"
                />
                <div class="suggest" id="suggest-box" hidden></div>
              </div>
              <p class="hint">
                Ketik <code>&amp;</code> atau <code>dan</code> untuk saran
                (Partner / Istri / Suami).
              </p>
            </div>
          </div>
        </section>

        <section class="layer-card">
          <div class="preview-header">
            <h2 class="preview-title">Hasil</h2>
            <div class="btn-group">
              <button class="btn btn--whatsapp" id="share-wa-btn" type="button">
                <svg
                  class="btn-icon"
                  viewBox="0 0 24 24"
                  width="14"
                  height="14"
                  fill="currentColor"
                  aria-hidden="true"
                >
                  <path
                    d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm0 18.15h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.23 8.24-8.23 2.2 0 4.27.86 5.82 2.42a8.18 8.18 0 0 1 2.41 5.83c0 4.54-3.7 8.22-8.22 8.22Zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.01-.38.11-.51.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.22.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.11-.22-.17-.47-.29Z"
                  />
                </svg>
                <span id="share-wa-label">WhatsApp</span>
              </button>
              <button class="btn" id="copy-btn" type="button">
                <span id="copy-label">Salin</span>
              </button>
            </div>
          </div>
          <div class="preview-body">
            <p class="preview-warning" id="preview-warning" hidden>
              Wajib isi nama penerima terlebih dahulu sebelum teks bisa disalin.
            </p>
            <p class="preview-text" id="preview"></p>
          </div>
        </section>
      </main>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
