<!DOCTYPE html>
<html lang="id" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template Undangan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <div class="page">
      <main class="container">
        <header class="page-header">
          <h1 class="page-title">Template Undangan</h1>
          <p class="page-description">
            Tulis teks template kamu, gunakan <code>$penerima</code> sebagai
            placeholder, lalu isi nama penerimanya.
          </p>
        </header>

        <section class="layer-card">
          <div class="form-grid">
            <div class="field">
              <label class="label" for="template">Teks Template</label>
              <textarea
                class="textarea"
                id="template"
                rows="8"
                placeholder="Tulis teks undangan di sini. Contoh:&#10;Kepada $penerima, kami mengundang Anda..."
              ></textarea>
              <p class="hint" id="template-hint">
                Gunakan <code>$penerima</code> sebagai pengganti nama.
              </p>
            </div>

            <div class="field">
              <label class="label" for="recipient">Nama Penerima</label>
              <input
                class="input"
                id="recipient"
                type="text"
                placeholder="Ketik nama di sini..."
              />
              <p class="hint">
                Hasil di bawah akan otomatis ter-update saat kamu mengetik.
              </p>
            </div>
          </div>
        </section>

        <section class="layer-card">
          <div class="preview-header">
            <h2 class="preview-title">Hasil</h2>
            <button class="btn" id="copy-btn" type="button">
              <span id="copy-label">Salin</span>
            </button>
          </div>
          <div class="preview-body">
            <p class="preview-text" id="preview"></p>
          </div>
        </section>
      </main>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
